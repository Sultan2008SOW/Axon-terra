<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="400" height="300" rx="16" fill="#eaf3ee"/>
  <rect x="0" y="0" width="400" height="300" rx="16" fill="none" stroke="#dcebe5" stroke-width="2"/>

  <!-- Subtle grid -->
  <g stroke="#c7ded4" stroke-width="0.5" opacity="0.4">
    <line x1="0" y1="60" x2="400" y2="60"/>
    <line x1="0" y1="120" x2="400" y2="120"/>
    <line x1="0" y1="180" x2="400" y2="180"/>
    <line x1="0" y1="240" x2="400" y2="240"/>
    <line x1="80" y1="0" x2="80" y2="300"/>
    <line x1="160" y1="0" x2="160" y2="300"/>
    <line x1="240" y1="0" x2="240" y2="300"/>
    <line x1="320" y1="0" x2="320" y2="300"/>
  </g>

  <!-- Simplified Senegal outline -->
  <path d="M60 220
           C50 190, 45 150, 55 120
           C60 95, 90 70, 115 60
           C160 45, 220 55, 270 70
           C320 85, 350 110, 345 140
           C340 165, 320 180, 300 195
           C285 210, 270 225, 250 240
           C225 250, 200 245, 175 235
           C140 225, 100 240, 75 235
           C65 232, 62 226, 60 220 Z"
        fill="#dcebe5" stroke="#2e6656" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Internal region shading -->
  <path d="M60 220
           C62 226, 65 232, 75 235
           C100 240, 140 225, 175 235
           C200 245, 225 250, 250 240
           C270 225, 285 210, 300 195
           C315 185, 325 175, 335 165
           L60 220 Z"
        fill="#2e6656" opacity="0.08"/>

  <!-- City markers -->
  <g>
    <!-- Dakar -->
    <circle cx="52" cy="150" r="5" fill="#0f2b25"/>
    <text x="52" y="170" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="9" font-weight="600" fill="#0f2b25">Dakar</text>

    <!-- Thiès -->
    <circle cx="95" cy="115" r="3.5" fill="#64748b"/>
    <text x="95" y="104" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="8" fill="#64748b">Thiès</text>

    <!-- Mbour -->
    <circle cx="80" cy="170" r="3.5" fill="#64748b"/>
    <text x="80" y="188" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="8" fill="#64748b">Mbour</text>

    <!-- Sandiara (pilot) -->
    <circle cx="98" cy="178" r="7" fill="#2e6656" filter="url(#glow)"/>
    <circle cx="98" cy="178" r="4" fill="#ffffff"/>
    <text x="98" y="197" text-anchor="middle" font-family="Sora, Arial, sans-serif" font-size="10" font-weight="700" fill="#2e6656">Sandiara</text>

    <!-- Fatick -->
    <circle cx="115" cy="145" r="3.5" fill="#64748b"/>
    <text x="115" y="138" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="8" fill="#64748b">Fatick</text>

    <!-- Kaolack -->
    <circle cx="155" cy="155" r="3.5" fill="#64748b"/>
    <text x="155" y="168" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="8" fill="#64748b">Kaolack</text>

    <!-- Tambacounda -->
    <circle cx="270" cy="165" r="3.5" fill="#64748b"/>
    <text x="270" y="182" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="8" fill="#64748b">Tamba</text>

    <!-- Ziguinchor -->
    <circle cx="230" cy="225" r="3.5" fill="#64748b"/>
    <text x="230" y="240" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="8" fill="#64748b">Ziguinchor</text>

    <!-- Other pilot communes (stylized) -->
    <circle cx="75" cy="130" r="4" fill="#2e6656"/>
    <text x="75" y="122" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="8" font-weight="600" fill="#0f2b25">Pilote</text>
    <circle cx="150" cy="120" r="4" fill="#2e6656"/>
    <text x="150" y="112" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="8" font-weight="600" fill="#0f2b25">Pilote</text>
  </g>

  <!-- Legend -->
  <g transform="translate(255, 22)">
    <rect width="128" height="52" rx="8" fill="#ffffff" stroke="#dcebe5" stroke-width="1"/>
    <circle cx="15" cy="18" r="5" fill="#2e6656"/>
    <text x="26" y="21" font-family="Inter, Arial, sans-serif" font-size="9" font-weight="600" fill="#0f2b25">Communes pilotes</text>
    <circle cx="15" cy="38" r="3.5" fill="#64748b"/>
    <text x="26" y="41" font-family="Inter, Arial, sans-serif" font-size="9" fill="#64748b">Références</text>
  </g>

  <text x="200" y="278" text-anchor="middle" font-family="Sora, Arial, sans-serif" font-size="12" font-weight="700" fill="#0f2b25">Carte du Sénégal — communes pilotes</text>
  <text x="200" y="292" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="9" fill="#64748b">Carte illustrative stylisée — carte réelle à insérer</text>
</svg>
